[project]
name = "lrn-voice-interview"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "pydantic-settings>=2.4.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "pytest-asyncio>=0.23.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

